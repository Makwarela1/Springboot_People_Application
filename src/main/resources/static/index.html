<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>People SPRINGBOOT API </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class = "login">
    <h3 class="form_message"> Registration Form </h3>
<div class = "form_content">
     <form class = "forms" id = "userForm">

         <label> Name: </label>
         <input type = "text" placeholder="Enter your name" id = "name" required>

         <label> Email: </label>
         <input type="email" placeholder="Enter your email" id="email" required>

     </form>
    <button class="submit" type = "submit" id="button"> Submit </button>
</div>

<script>
    const userForm = document.getElementById("userForm");

    userForm.addEventListener("submit", async function (event){
        event.preventDefault();

        const userData = {
            name:document.getElementById("name").value,
            email:document.getElementById("email").value,
        };

        try {
            const response = await fetch ("/api/people", { method: "POST",

                headers: {
                "Content-Type" : "application/json",
            },
                body: JSON.stringify(userData),
            });

            const responseText = await response.text();

            console.log("Status: ", response.status);
            console.log("Response: ", responseText);

            if (!response.ok){
                throw new Error (`Servor error ${response.status}: ${responseText}`);
            }

            const result = JSON.parse(responseText);

            document.getElementById("message").innerText = "User saved successfully! : " +result.name;

            console.log(result.name)

            userForm.reset ();
        } catch (error) {
            console.error("Error", error);

            document.getElementById("message").innerText = error.message;
        }
    });
</script>
</body>
</html>
